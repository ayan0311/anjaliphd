<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Authorship Examination</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bentham&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>

  <body>
    <nav class="navbar bg-light border-bottom border-body">
      <!-- Navbar content -->
      <a
        class="navbar-brand ms-4"
        href="https://www.linkedin.com/in/anjali-karmakar-sarkar-554326111/"
        target="_blank"
        >Anjali K Sarkar, NUJS</a
      >
      <div class="ms-auto me-3">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/login"> Researcher Login</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="container gap-3 ps-3 pe-3">
      <h6 class="intro-header mt-4">READER DISCERNMENT STUDY</h6>
      <h1 class="header">The Authorship Examination</h1>
      <p class="intro">
        Read each passage. Decide: written by a human author, or generated by an
        AI model. <br class="d-none d-md-block" />
        Your calls are logged anonymously to build a reader-accuracy dataset.
      </p>
    </div>

    <main>{% block main %} {% endblock %}</main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
